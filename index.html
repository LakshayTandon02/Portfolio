    <script>
      // Gracefully ignore harmless Vite HMR WebSocket connection notices in iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && (
          String(event.reason).toLowerCase().includes('websocket') ||
          String(event.reason.message || '').toLowerCase().includes('websocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (event && (
          String(event.message || '').toLowerCase().includes('websocket') ||
          String(event.message || '').toLowerCase().includes('[vite]')
        )) {
          event.preventDefault();
        }
      });
    </script>
